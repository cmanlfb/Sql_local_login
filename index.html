<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutzerverwaltung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <div class="card" id="login-card">
      <h1>Login</h1>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">Benutzername</label>
          <input type="text" id="login-username" name="login-username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="login-password">Passwort</label>
          <input type="password" id="login-password" name="login-password" required autocomplete="current-password">
        </div>

        <button type="submit">Einloggen</button>
      </form>

      <div id="login-message" class="message" role="status"></div>
    </div>

    <div class="card" id="logged-in-card" hidden>
      <div class="logged-in-bar">
        <span id="logged-in-as"></span>
        <button type="button" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="card" id="register-card">
      <h1>Neuen Nutzer anlegen</h1>

      <form id="user-form" novalidate>
        <div class="form-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit">Nutzer anlegen</button>
      </form>

      <div id="message" class="message" role="status"></div>
    </div>

    <div class="card" id="user-list-card" hidden>
      <h2>Vorhandene Nutzer</h2>
      <div id="user-list" class="user-list">
        <p class="hint">Lade Nutzer …</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
